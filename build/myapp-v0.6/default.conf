server {
    listen 8080;
    server_name localhost;

    location / {
        add_header Content-Type text/plain;
        return 200 "hello world v0.6\n$hostname\n";
    }

    location /health {
        if ($arg_code = "404") {
            return 404 "Not Found\n";
        }
        return 200 "health checked v0.6\n$hostname\n";
    }
}